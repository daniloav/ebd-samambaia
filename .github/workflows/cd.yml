name: CD · Deploy OCI

# Faz o deploy no VM da Oracle Cloud via SSH (rsync do código + docker compose na VM).
# Enquanto os secrets OCI_* não estiverem cadastrados, roda em MODO MOCK (não faz deploy),
# apenas registra os passos — útil até a VM ser provisionada.

on:
  workflow_dispatch: {}          # disparo manual
  workflow_run:                  # SÓ na main: dispara após o CI concluir na main
    workflows: ["CI"]
    types: [completed]
    branches: [main]            # <- deploy nunca roda para a develop

permissions:
  contents: write

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy na VM OCI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # roda no dispatch manual, ou quando o CI terminou com sucesso
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      OCI_HOST: ${{ secrets.OCI_SSH_HOST }}
      OCI_USER: ${{ secrets.OCI_SSH_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      OCI_ENV: ${{ secrets.OCI_ENV_FILE }}
      JWT_PRIV: ${{ secrets.EBD_JWT_PRIVATE_KEY }}
      JWT_PUB: ${{ secrets.EBD_JWT_PUBLIC_KEY }}
      APP_DIR: ebd-samambaia
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Verificar se os secrets OCI estão preenchidos (não-placeholder)
        id: cfg
        run: |
          if [ -n "$OCI_HOST" ] && [ "$OCI_HOST" != "CHANGEME" ] \
             && [ -n "$OCI_USER" ] \
             && [ -n "$OCI_SSH_KEY" ] && [ "$OCI_SSH_KEY" != "CHANGEME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------- MODO MOCK ----------------
      - name: MOCK — recursos OCI ainda não provisionados
        if: steps.cfg.outputs.ready != 'true'
        run: |
          echo "::notice title=Deploy em modo MOCK::Secrets OCI com placeholder (CHANGEME); nenhum deploy real executado."
          cat <<'EOF'
          ─────────────────────────────────────────────────────────────
          MODO MOCK — os secrets existem, mas com valor placeholder (CHANGEME).
          Quando a VM estiver pronta, ATUALIZE os secrets com os valores reais:
            • OCI_SSH_HOST   = IP público da VM (ex.: 140.238.x.x)
            • OCI_SSH_USER   = ubuntu (já definido)
            • OCI_SSH_KEY    = conteúdo da chave PRIVADA de deploy
            • OCI_ENV_FILE   = (opcional) conteúdo do .env de produção
          Passos que SERIAM executados:
            1) Configurar SSH e known_hosts
            2) (opcional) enviar .env de produção para a VM
            3) rsync do código → ~/ebd-samambaia na VM
            4) docker compose up -d --build
            5) healthcheck em http://$OCI_HOST/q/health
          ─────────────────────────────────────────────────────────────
          EOF

      # ---------------- DEPLOY REAL ----------------
      - name: Configurar SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Bump de versão (SemVer por commit) + tag
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW="$(bash scripts/bump-version.sh)"
          echo "::notice title=Versão::Deployando v$NEW"
          if [ -n "$(git status --porcelain frontend/src/app/version.ts)" ]; then
            git add frontend/src/app/version.ts
            git commit -m "chore(release): v$NEW [skip ci]"
            git push origin HEAD:main
          fi
          if ! git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            git tag "v$NEW"
            git push origin "v$NEW"
          fi

      - name: Enviar .env de produção (se configurado)
        if: steps.cfg.outputs.ready == 'true' && env.OCI_ENV != ''
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_deploy "$OCI_USER@$OCI_HOST" "mkdir -p ~/$APP_DIR"
          printf '%s' "$OCI_ENV" | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_deploy "$OCI_USER@$OCI_HOST" "cat > ~/$APP_DIR/.env"

      - name: Enviar código para a VM (rsync)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'target' \
            --exclude '.env' --exclude 'dist' --exclude '.angular' --exclude 'backups' \
            -e "ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_deploy" ./ "$OCI_USER@$OCI_HOST:~/$APP_DIR/"

      - name: Chaves JWT persistentes (opt-in via secrets)
        # Se os secrets estiverem definidos, grava as MESMAS chaves a cada deploy,
        # de modo que os tokens dos usuários sobrevivam às reconstruções.
        # Sem os secrets, este passo é pulado e o Dockerfile gera chaves (comportamento antigo).
        if: steps.cfg.outputs.ready == 'true' && env.JWT_PRIV != '' && env.JWT_PUB != ''
        run: |
          # Aspas: o ~ deve expandir NA VM (sem aspas expandiria no runner p/ /home/runner)
          DEST="~/$APP_DIR/backend/src/main/resources"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_deploy "$OCI_USER@$OCI_HOST" "mkdir -p $DEST"
          printf '%s' "$JWT_PRIV" | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_deploy "$OCI_USER@$OCI_HOST" "cat > $DEST/privateKey.pem"
          printf '%s' "$JWT_PUB"  | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_deploy "$OCI_USER@$OCI_HOST" "cat > $DEST/publicKey.pem"
          echo 'Chaves JWT persistentes gravadas na VM.'

      - name: Backup do banco antes do deploy (pg_dump)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_deploy "$OCI_USER@$OCI_HOST" "cd ~/$APP_DIR && bash scripts/backup-db.sh"

      - name: Subir stack na VM (docker compose)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_deploy "$OCI_USER@$OCI_HOST" "
            cd ~/$APP_DIR &&
            docker compose up -d --build &&
            docker compose ps &&
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
          "

      - name: Faxina do Docker na VM (cache dangling + imagens órfãs)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_deploy "$OCI_USER@$OCI_HOST" "
            docker builder prune -f >/dev/null 2>&1 || true;
            docker image prune -f >/dev/null 2>&1 || true;
            echo 'Faxina do Docker concluída.'
          "

      - name: Healthcheck
        if: steps.cfg.outputs.ready == 'true'
        env:
          URL: ${{ vars.PROD_URL || format('http://{0}', secrets.OCI_SSH_HOST) }}
        run: |
          echo "Aguardando a aplicação responder em $URL ..."
          for i in $(seq 1 18); do
            if curl -fsS "$URL/q/health" >/dev/null 2>&1; then
              echo "✅ Aplicação no ar em $URL"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Healthcheck falhou após ~3min"; exit 1
