name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ---------------- Build & testes ----------------
  backend:
    name: Backend · build & testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebd
          POSTGRES_PASSWORD: ebd
          POSTGRES_DB: ebd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ebd -d ebd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Gerar chaves JWT (não versionadas)
        run: bash scripts/gen-jwt-keys.sh
      - name: Build & testes (Quarkus)
        working-directory: backend
        run: mvn -B -ntp verify

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar & build (Angular)
        working-directory: frontend
        run: |
          npm ci
          npx ng build

  # ---------------- SAST (análise estática de código) ----------------
  sast-semgrep:
    name: SAST · Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Análise Semgrep (segurança + qualidade)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/java \
            --config p/javascript \
            --config p/typescript \
            --config p/dockerfile \
            --sarif --output semgrep.sarif \
            --error --metrics=off
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ---------------- Dependências, IaC e segredos ----------------
  trivy:
    name: Dependências & IaC · Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pré-baixar a imagem do Trivy (com retry)
        run: for i in 1 2 3; do docker pull aquasec/trivy:latest && break || sleep 10; done
      - name: Relatório HIGH/CRITICAL (não bloqueia)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig --offline-scan \
            --severity HIGH,CRITICAL --no-progress \
            --format table /repo | tee trivy-report.txt
      - name: Gate — falha em CRITICAL
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig --offline-scan \
            --severity CRITICAL --no-progress --exit-code 1 /repo
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  gitleaks:
    name: Segredos · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pré-baixar a imagem do gitleaks (com retry)
        run: for i in 1 2 3; do docker pull zricethezav/gitleaks:latest && break || sleep 10; done
      - name: Procurar segredos no código atual
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --no-git --source /repo --redact --verbose --exit-code 1

  # ---------------- Migrations contra Postgres real ----------------
  migrations:
    name: Migrations · app real (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebd
          POSTGRES_PASSWORD: ebd
          POSTGRES_DB: ebd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ebd -d ebd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Gerar chaves JWT (o app precisa para subir)
        run: bash scripts/gen-jwt-keys.sh
      - name: Empacotar backend
        working-directory: backend
        run: mvn -B -ntp package -DskipTests
      - name: Subir o app contra Postgres (aplica migrations + valida startup)
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/ebd
          QUARKUS_DATASOURCE_USERNAME: ebd
          QUARKUS_DATASOURCE_PASSWORD: ebd
        run: |
          java -jar backend/target/quarkus-app/quarkus-run.jar > app.log 2>&1 &
          APP_PID=$!
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/q/health 2>/dev/null | grep -q '"status": "UP"'; then ok=1; break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then echo "o app encerrou antes de ficar UP"; break; fi
            sleep 3
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "::error title=Migrations::App não subiu — migration quebrada ou schema/entidade divergente"
            echo "----- últimas linhas do log -----"; tail -n 60 app.log
            exit 1
          fi
          echo "✅ Migrations aplicadas e app subiu."
          grep -iE "Migrating schema|Successfully applied|Installed features" app.log | tail -n 20 || true
