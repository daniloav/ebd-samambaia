name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ---------------- Build & testes ----------------
  backend:
    name: Backend · build & testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Gerar chaves JWT (não versionadas)
        run: bash scripts/gen-jwt-keys.sh
      - name: Build & testes (Quarkus)
        working-directory: backend
        run: mvn -B -ntp verify

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar & build (Angular)
        working-directory: frontend
        run: |
          npm ci
          npx ng build

  # ---------------- SAST (análise estática de código) ----------------
  sast-semgrep:
    name: SAST · Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Análise Semgrep (segurança + qualidade)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/java \
            --config p/javascript \
            --config p/typescript \
            --config p/dockerfile \
            --sarif --output semgrep.sarif \
            --error --metrics=off
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ---------------- Dependências, IaC e segredos ----------------
  trivy:
    name: Dependências & IaC · Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relatório HIGH/CRITICAL (não bloqueia)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig --offline-scan \
            --severity HIGH,CRITICAL --no-progress \
            --format table /repo | tee trivy-report.txt
      - name: Gate — falha em CRITICAL
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig --offline-scan \
            --severity CRITICAL --no-progress --exit-code 1 /repo
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  gitleaks:
    name: Segredos · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar segredos no código atual
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --no-git --source /repo --redact --verbose --exit-code 1
