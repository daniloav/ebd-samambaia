# ===================== Aplicação =====================
quarkus.application.name=ebd-backend
quarkus.http.port=8080

# ===================== Banco de dados =====================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:ebd}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:ebd}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/ebd}

# O schema é gerenciado pelo Flyway (migrations em db/migration).
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.clean-disabled=true

# ===================== Segurança / JWT =====================
mp.jwt.verify.publickey.location=${EBD_JWT_PUBLIC_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=https://ebd.ice.samambaia
smallrye.jwt.sign.key.location=${EBD_JWT_PRIVATE_LOCATION:privateKey.pem}
# Validade do token em segundos (8 horas)
ebd.jwt.duration-seconds=28800

# Usuários padrão criados no primeiro boot (troque em produção!)
ebd.seed.admin.username=${EBD_ADMIN_USERNAME:admin}
ebd.seed.admin.password=${EBD_ADMIN_PASSWORD:admin123}
ebd.seed.professor.username=${EBD_PROFESSOR_USERNAME:professor}
ebd.seed.professor.password=${EBD_PROFESSOR_PASSWORD:prof123}

# ===================== CORS =====================
# Só em DEV (front em :4200 chamando :8080). Em produção o nginx faz proxy
# same-origin de /api, então o CORS fica DESLIGADO (não aceitar outras origens).
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=/.*/
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=Content-Type,Authorization

# ===================== OpenAPI / Swagger =====================
quarkus.smallrye-openapi.info-title=API EBD Adultos - ICE Samambaia
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ===================== Dev =====================
%dev.quarkus.log.category."br.com.ice.ebd".level=DEBUG

# ===================== Notificações / E-mail =====================
# Liga/desliga o envio de alertas de chamada por e-mail (padrão: desligado).
ebd.notificacoes.enabled=${EBD_NOTIF_ENABLED:false}
# Remetente exibido nos e-mails.
quarkus.mailer.from=${EBD_MAIL_FROM:EBD ICE Samambaia <no-reply@ebd-ices.duckdns.org>}
# SMTP (preencher em produção via env — ex.: Brevo). Em dev fica em modo mock (só loga).
quarkus.mailer.host=${EBD_SMTP_HOST:smtp-relay.brevo.com}
quarkus.mailer.port=${EBD_SMTP_PORT:587}
quarkus.mailer.username=${EBD_SMTP_USER:}
quarkus.mailer.password=${EBD_SMTP_PASS:}
quarkus.mailer.start-tls=REQUIRED
# Em desenvolvimento não envia de verdade: apenas registra o e-mail no log.
%dev.quarkus.mailer.mock=true
# Em dev, liga as notificações (com mock, só aparecem no log).
%dev.ebd.notificacoes.enabled=true

# ---- Batches agendados (cron Quarkus, fuso America/Sao_Paulo) ----
# Lembrete de chamada pendente: de hora em hora, das 12h às 21h, no dia da aula.
ebd.lembrete-chamada.cron=${EBD_LEMBRETE_CHAMADA_CRON:0 0 12-21 * * ?}
# Leitura bíblica diária: todo dia às 12h (BRT), envia aos alunos o texto do dia da lição.
ebd.leitura-diaria.cron=${EBD_LEITURA_DIARIA_CRON:0 0 12 * * ?}
# Nos testes os batches são disparados manualmente — o agendador fica desligado.
%test.ebd.lembrete-chamada.cron=off
%test.ebd.aniversario.cron=off
%test.ebd.cobranca-nota.cron=off
%test.ebd.leitura-diaria.cron=off

# ---- Texto bíblico da leitura diária (busca na internet) ----
# bible-api.com, tradução João Ferreira de Almeida (domínio público), sem chave de acesso.
# Falha/timeout não quebra nada: o e-mail sai só com a referência.
ebd.biblia.enabled=${EBD_BIBLIA_ENABLED:true}
ebd.biblia.url=${EBD_BIBLIA_URL:https://bible-api.com}
ebd.biblia.traducao=${EBD_BIBLIA_TRADUCAO:almeida}
# Nos testes não se acessa a internet — o e-mail leva só a referência.
%test.ebd.biblia.enabled=false

# Uploads de campanha (até 5 imagens de 2 MB + campos)
quarkus.http.limits.max-body-size=16M

# ---- Testes (@QuarkusTest) — Postgres nativo local / service no CI, banco separado ebd_test ----
%test.quarkus.datasource.jdbc.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/ebd_test}
%test.quarkus.datasource.username=${TEST_DB_USER:ebd}
%test.quarkus.datasource.password=${TEST_DB_PASS:ebd}
%test.quarkus.datasource.devservices.enabled=false
%test.ebd.notificacoes.enabled=true
%test.quarkus.mailer.mock=true
