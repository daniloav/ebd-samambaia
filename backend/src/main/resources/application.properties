# ===================== Aplicação =====================
quarkus.application.name=ebd-backend
quarkus.http.port=8080

# ===================== Banco de dados =====================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:ebd}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:ebd}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/ebd}

# O schema é gerenciado pelo Flyway (migrations em db/migration).
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# ===================== Segurança / JWT =====================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://ebd.ice.samambaia
smallrye.jwt.sign.key.location=privateKey.pem
# Validade do token em segundos (8 horas)
ebd.jwt.duration-seconds=28800

# Usuários padrão criados no primeiro boot (troque em produção!)
ebd.seed.admin.username=${EBD_ADMIN_USERNAME:admin}
ebd.seed.admin.password=${EBD_ADMIN_PASSWORD:admin123}
ebd.seed.professor.username=${EBD_PROFESSOR_USERNAME:professor}
ebd.seed.professor.password=${EBD_PROFESSOR_PASSWORD:prof123}

# ===================== CORS (dev) =====================
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# ===================== OpenAPI / Swagger =====================
quarkus.smallrye-openapi.info-title=API EBD Adultos - ICE Samambaia
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ===================== Dev =====================
%dev.quarkus.log.category."br.com.ice.ebd".level=DEBUG

# ===================== Notificações / E-mail =====================
# Liga/desliga o envio de alertas de chamada por e-mail (padrão: desligado).
ebd.notificacoes.enabled=${EBD_NOTIF_ENABLED:false}
# Remetente exibido nos e-mails.
quarkus.mailer.from=${EBD_MAIL_FROM:EBD ICE Samambaia <no-reply@ebd-ices.duckdns.org>}
# SMTP (preencher em produção via env — ex.: Brevo). Em dev fica em modo mock (só loga).
quarkus.mailer.host=${EBD_SMTP_HOST:smtp-relay.brevo.com}
quarkus.mailer.port=${EBD_SMTP_PORT:587}
quarkus.mailer.username=${EBD_SMTP_USER:}
quarkus.mailer.password=${EBD_SMTP_PASS:}
quarkus.mailer.start-tls=REQUIRED
# Em desenvolvimento não envia de verdade: apenas registra o e-mail no log.
%dev.quarkus.mailer.mock=true
# Em dev, liga as notificações (com mock, só aparecem no log).
%dev.ebd.notificacoes.enabled=true
