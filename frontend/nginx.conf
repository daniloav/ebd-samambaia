server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos + fallback SPA (rotas do Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy da API para o backend Quarkus (nome do serviço no docker-compose)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # (Opcional) Swagger UI / health do backend
    location /q/ {
        proxy_pass http://backend:8080/q/;
        proxy_set_header Host $host;
    }

    # Cache de assets
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
