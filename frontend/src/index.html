<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>EBD ICES · ICE Samambaia</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b3a5b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EBD ICES">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body>
  <app-root>
    <!-- Placeholder até o Angular montar. Se o app NÃO abrir (navegador antigo),
         o script no fim da página troca isto por uma mensagem amigável. -->
    <div id="ebd-carregando" style="position:fixed;inset:0;display:flex;align-items:center;
         justify-content:center;background:#1b3a5b;color:#e6c877;font-family:Georgia,serif;
         font-size:20px;letter-spacing:.5px;">Carregando EBD ICES…</div>
  </app-root>

  <!-- Mensagem para navegador sem suporte (fica oculta até o timeout) -->
  <div id="ebd-sem-suporte" style="display:none;position:fixed;inset:0;padding:1.5rem;
       background:#1b3a5b;color:#fff;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
       text-align:center;align-items:center;justify-content:center;flex-direction:column;">
    <div style="max-width:30rem">
      <div style="font-size:2.5rem">📖</div>
      <h1 style="color:#e6c877;margin:.6rem 0">Não foi possível abrir o app</h1>
      <p style="line-height:1.5">Seu navegador pode estar desatualizado. Atualize o
        <b>iOS/Safari</b> (Ajustes → Geral → Atualização de Software) ou use o
        <b>Google Chrome</b>, e tente novamente.</p>
      <p><a href="/" style="color:#e6c877">Tentar de novo</a></p>
      <p id="ebd-erro" style="opacity:.6;font-size:.8rem;margin-top:1rem;word-break:break-word"></p>
    </div>
  </div>

  <script>
    // 1) Captura o primeiro erro de script (ajuda a diagnosticar navegador antigo).
    (function () {
      var primeiroErro = '';
      window.addEventListener('error', function (e) {
        if (!primeiroErro) { primeiroErro = (e && e.message) ? e.message : 'erro de script'; }
      }, true);
      // 2) Se em 12s o app não montou (o placeholder ainda existe), mostra a mensagem.
      setTimeout(function () {
        if (document.getElementById('ebd-carregando')) {
          var s = document.getElementById('ebd-sem-suporte');
          if (s) { s.style.display = 'flex'; }
          var er = document.getElementById('ebd-erro');
          if (er && primeiroErro) { er.textContent = 'Detalhe técnico: ' + primeiroErro; }
        }
      }, 12000);
    })();

    // 3) Service worker só em produção (fora do localhost).
    if ('serviceWorker' in navigator &&
        location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
