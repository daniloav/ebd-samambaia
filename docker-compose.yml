# Stack completo (produção / VM Oracle Cloud): Postgres + Backend Quarkus + Frontend Angular (nginx)
# Uso: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: ebd-postgres
    restart: unless-stopped
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebd}
      POSTGRES_USER: ${POSTGRES_USER:-ebd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebd}
    volumes:
      - ebd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ebd} -d ${POSTGRES_DB:-ebd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ebd-net

  backend:
    build:
      context: ./backend
    container_name: ebd-backend
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ebd}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-ebd}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ebd}
      # Troque estas credenciais padrão em produção:
      EBD_ADMIN_USERNAME: ${EBD_ADMIN_USERNAME:-admin}
      EBD_ADMIN_PASSWORD: ${EBD_ADMIN_PASSWORD:-admin123}
      EBD_PROFESSOR_USERNAME: ${EBD_PROFESSOR_USERNAME:-professor}
      EBD_PROFESSOR_PASSWORD: ${EBD_PROFESSOR_PASSWORD:-prof123}
      # Alertas por e-mail (desligado por padrão; ligue definindo estas no .env):
      EBD_NOTIF_ENABLED: ${EBD_NOTIF_ENABLED:-false}
      EBD_MAIL_FROM: ${EBD_MAIL_FROM:-EBD ICE Samambaia <no-reply@ebd-ices.duckdns.org>}
      EBD_SMTP_HOST: ${EBD_SMTP_HOST:-smtp-relay.brevo.com}
      EBD_SMTP_PORT: ${EBD_SMTP_PORT:-587}
      EBD_SMTP_USER: ${EBD_SMTP_USER:-}
      EBD_SMTP_PASS: ${EBD_SMTP_PASS:-}
    networks:
      - ebd-net

  frontend:
    build:
      context: ./frontend
    container_name: ebd-frontend
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - backend
    networks:
      - ebd-net

  caddy:
    image: caddy:2-alpine
    container_name: ebd-caddy
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ebd-net

volumes:
  ebd_pgdata:
  caddy_data:
  caddy_config:

networks:
  ebd-net:
    driver: bridge
